    // localStorage keys
    const STORAGE_KEYS = {
      SETTINGS: 'tajweed_settings',
      HISTORY: 'tajweed_history',
      RECORDINGS: 'tajweed_recordings'
    };

    // Load from localStorage
    const loadFromStorage = (key, defaultValue) => {
      try {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : defaultValue;
      } catch (e) {
        console.log('Error loading from storage:', e);
        return defaultValue;
      }
    };

    // Save to localStorage
    const saveToStorage = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.log('Error saving to storage:', e);
      }
    };

    function TajweedTrainer() {
      // Load saved settings
      const savedSettings = loadFromStorage(STORAGE_KEYS.SETTINGS, {});
      const savedHistory = loadFromStorage(STORAGE_KEYS.HISTORY, []);
      const savedRecordings = loadFromStorage(STORAGE_KEYS.RECORDINGS, []);
      
      const [surahStart, setSurahStart] = useState(savedSettings.surahStart || 1);
      const [surahEnd, setSurahEnd] = useState(savedSettings.surahEnd || 1);
      const [ayahStart, setAyahStart] = useState(savedSettings.ayahStart || 1);
      const [ayahEnd, setAyahEnd] = useState(savedSettings.ayahEnd || 1);
      const [arabicText, setArabicText] = useState('');
      const [reciter, setReciter] = useState(savedSettings.reciter || 'yasser_dosari');
      
      const [extractedRules, setExtractedRules] = useState(null);
      const [isFetchingTajweed, setIsFetchingTajweed] = useState(false);
      const [coloredArabicHtml, setColoredArabicHtml] = useState('');
      
      const [isRecording, setIsRecording] = useState(false);
      const [recordingTime, setRecordingTime] = useState(0);
      const [audioLevel, setAudioLevel] = useState(0);
      const [userRecordings, setUserRecordings] = useState(savedRecordings);
      
      const [isPlayingReference, setIsPlayingReference] = useState(false);
      const [playbackSpeed, setPlaybackSpeed] = useState(savedSettings.playbackSpeed || 0.75);
      const [loopMode, setLoopMode] = useState(savedSettings.loopMode || false);
      const [includeBismillah, setIncludeBismillah] = useState(savedSettings.includeBismillah !== false);
      
      const [feedback, setFeedback] = useState(null);
      const [error, setError] = useState(null);
      const [sessionHistory, setSessionHistory] = useState(savedHistory);
      const [showLegend, setShowLegend] = useState(false);
      const [selectedRule, setSelectedRule] = useState(null);
      
      const [currentPlayingSurah, setCurrentPlayingSurah] = useState(null);
      const [currentPlayingAyah, setCurrentPlayingAyah] = useState(null);
      
      // Microphone selection
      const [audioDevices, setAudioDevices] = useState([]);
      const [selectedMic, setSelectedMic] = useState('');
      const [isPlayingUserRecording, setIsPlayingUserRecording] = useState(null);
      const [lastRecordingSaved, setLastRecordingSaved] = useState(null);
      const [showChecklist, setShowChecklist] = useState(false);
      
      // Display controls
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [fontSize, setFontSize] = useState(savedSettings.fontSize || 32);
      const [verseStep, setVerseStep] = useState(savedSettings.verseStep || 5);
      const [currentPage, setCurrentPage] = useState(0);
      const [allVersesHtml, setAllVersesHtml] = useState([]); // Store each verse's HTML separately
      const [lineHeight, setLineHeight] = useState(savedSettings.lineHeight || 2.0);
      const [navStep, setNavStep] = useState(savedSettings.navStep || 5); // How many verses to jump when navigating
      
      // Analysis features
      const [showAnalysis, setShowAnalysis] = useState(false);
      const [referenceWaveform, setReferenceWaveform] = useState(null);
      const [userWaveform, setUserWaveform] = useState(null);
      const [referenceDuration, setReferenceDuration] = useState(null);
      const [selectedRecordingForAnalysis, setSelectedRecordingForAnalysis] = useState(null);
      const [analysisResults, setAnalysisResults] = useState(null);
      const [isLoadingAnalysis, setIsLoadingAnalysis] = useState(false);
      const [ruleScores, setRuleScores] = useState({}); // Track self-scores per rule
      const referenceCanvasRef = useRef(null);
      const userCanvasRef = useRef(null);
      
      // Save settings whenever they change
      React.useEffect(() => {
        saveToStorage(STORAGE_KEYS.SETTINGS, {
          surahStart, surahEnd, ayahStart, ayahEnd,
          reciter, playbackSpeed, loopMode, includeBismillah,
          fontSize, verseStep, lineHeight, navStep
        });
      }, [surahStart, surahEnd, ayahStart, ayahEnd, reciter, playbackSpeed, loopMode, includeBismillah, fontSize, verseStep, lineHeight, navStep]);
      
      // Save session history whenever it changes
      React.useEffect(() => {
        saveToStorage(STORAGE_KEYS.HISTORY, sessionHistory);
      }, [sessionHistory]);
      
      // Save recordings whenever they change (metadata only, URLs are blob URLs)
      React.useEffect(() => {
        // Filter out blob URLs (they don't persist) and save metadata
        const persistableRecordings = userRecordings.map(r => ({
          ...r,
          url: r.dataUrl || null // Only save if we have a data URL
        })).filter(r => r.url);
        saveToStorage(STORAGE_KEYS.RECORDINGS, persistableRecordings);
      }, [userRecordings]);
      
      // Navigate to next/previous verses
      const navigateVerses = (direction) => {
        // direction: 1 for next, -1 for previous
        const step = navStep * direction;
        
        let newSurah = surahStart;
        let newAyah = ayahStart + step;
        
        // Handle overflow/underflow
        if (newAyah > SURAH_DATA[newSurah]?.ayahs) {
          // Move to next surah(s)

      // ═══════════════════════════════════════════════════════════════════════
      // AUDIO ANALYSIS FUNCTIONS

      // Extract waveform data from audio URL (works with data URLs, blob URLs, and same-origin)
      const extractWaveform = async (audioUrl, numSamples = 80) => {
        try {
          // For data URLs and blob URLs, use fetch + Web Audio API
          if (audioUrl && (audioUrl.startsWith('data:') || audioUrl.startsWith('blob:'))) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const response = await fetch(audioUrl);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            
            const channelData = audioBuffer.getChannelData(0);
            const samples = [];
            const blockSize = Math.floor(channelData.length / numSamples);
            
            for (let i = 0; i < numSamples; i++) {
              const start = blockSize * i;
              let sum = 0;
              for (let j = 0; j < blockSize; j++) {
                sum += Math.abs(channelData[start + j]);
              }
              samples.push(sum / blockSize);
            }
            
            const max = Math.max(...samples);
            const normalized = samples.map(s => max > 0 ? s / max : 0);
            
            audioContext.close();
            return {
              samples: normalized,
              duration: audioBuffer.duration,
              sampleRate: audioBuffer.sampleRate
            };
          }
          
          // For external URLs, use Audio element (avoids CORS)
          return await extractWaveformFromUrl(audioUrl, numSamples);
        } catch (err) {
          console.error('Waveform extraction error:', err);
          return null;
        }
      };
      
      // Extract waveform using Audio element (for cross-origin audio)
      const extractWaveformFromUrl = async (audioUrl, numSamples = 80) => {
        return new Promise((resolve) => {
          const audio = new Audio();
          audio.crossOrigin = 'anonymous';
          
          audio.onloadedmetadata = () => {
            const duration = audio.duration;
            
            // Since we can't access raw audio data due to CORS,
            // generate a placeholder waveform based on duration
            // The actual comparison will be timing-based
            const samples = [];
            for (let i = 0; i < numSamples; i++) {
              // Create a simple wave pattern for visual reference
              const t = i / numSamples;
              const wave = 0.3 + 0.4 * Math.sin(t * Math.PI * 8) * Math.sin(t * Math.PI * 2);
              samples.push(Math.abs(wave));
            }
            
            resolve({
              samples,
              duration,
              sampleRate: 44100,
              isPlaceholder: true
            });
          };
          
          audio.onerror = () => {
            console.log('Could not load audio:', audioUrl);
            resolve(null);
          };
          
          audio.src = audioUrl;
        });
      };
      
      // Extract combined waveform from multiple ayah URLs
      const extractCombinedWaveform = async (recording, numSamples = 80) => {
        try {
          // Collect all ayah URLs
          const ayahUrls = [];
          for (let s = recording.surahStart; s <= recording.surahEnd; s++) {
            const startAyah = s === recording.surahStart ? recording.ayahStart : 1;
            const endAyah = s === recording.surahEnd ? recording.ayahEnd : SURAH_DATA[s]?.ayahs;
            
            for (let a = startAyah; a <= endAyah; a++) {
              ayahUrls.push(getReferenceAudioUrl(s, a));
            }
          }
          
          // Limit to 20 ayahs max for performance
          const urlsToLoad = ayahUrls.slice(0, 20);
          
          // Load duration of each audio file
          let totalDuration = 0;
          const durations = [];
          
          for (const url of urlsToLoad) {
            try {
              const duration = await new Promise((resolve) => {
                const audio = new Audio();
                audio.onloadedmetadata = () => resolve(audio.duration);
                audio.onerror = () => resolve(0);
                setTimeout(() => resolve(0), 3000);
                audio.src = url;
              });
              durations.push(duration);
              totalDuration += duration;
            } catch (e) {
              console.log('Could not load:', url);
            }
          }
          
          if (totalDuration === 0) return null;
          
          // Generate combined placeholder waveform
          const samples = [];
          const samplesPerAyah = Math.floor(numSamples / durations.length);
          
          durations.forEach((dur, ayahIndex) => {
            const ayahSamples = Math.round((dur / totalDuration) * numSamples);
            for (let i = 0; i < ayahSamples && samples.length < numSamples; i++) {
              const t = i / ayahSamples;
              // Create variation between ayahs
              const baseWave = 0.3 + 0.5 * Math.sin(t * Math.PI * 6 + ayahIndex) * Math.sin(t * Math.PI);
              // Add small gap between ayahs
              const isGap = t > 0.95;
              samples.push(isGap ? 0.1 : Math.abs(baseWave));
            }
          });
          
          // Pad to exact numSamples
          while (samples.length < numSamples) samples.push(0.2);
          
          // Normalize
          const max = Math.max(...samples);
          const normalized = samples.map(s => max > 0 ? s / max : 0);
          
          return {
            samples: normalized,
            duration: totalDuration,
            sampleRate: 44100,
            ayahCount: durations.length,
            isPlaceholder: true
          };
        } catch (err) {
          console.error('Combined waveform extraction error:', err);
          return null;
        }
      };
      
      // Draw waveform on canvas
      const drawWaveform = (canvas, waveformData, color, label) => {
        if (!canvas || !waveformData) return;
        
        const samples = waveformData.samples;
        if (!samples || samples.length === 0) return;
        
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        
        // Clear
        ctx.fillStyle = '#fef3c7'; // amber-100
        ctx.fillRect(0, 0, width, height);
        
        // Draw center line
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(0, height / 2);
        ctx.lineTo(width, height / 2);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Draw waveform bars
        ctx.fillStyle = color;
        const barWidth = width / samples.length;
        
        samples.forEach((sample, i) => {
          const barHeight = Math.max(2, sample * (height * 0.8));
          const x = i * barWidth;
          const y = (height - barHeight) / 2;
          ctx.fillRect(x, y, Math.max(1, barWidth - 1), barHeight);
        });
        
        // Label
        ctx.fillStyle = '#78350f';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(label, 10, 20);
        
        // Duration
        ctx.fillStyle = '#92400e';
        ctx.font = '11px sans-serif';
        ctx.fillText(`${waveformData.duration.toFixed(1)}s`, width - 40, 20);
      };

              totalRefDuration = refWaveform?.duration || 0;
            } else {
              // Multiple ayahs - combine all into one waveform
              refWaveform = await extractCombinedWaveform(recording);
              totalRefDuration = refWaveform?.duration || 0;
            }
            
            setReferenceWaveform(refWaveform);
            setReferenceDuration(totalRefDuration);
            
            // Calculate timing comparison
            if (userWf && totalRefDuration > 0) {
              const userDur = userWf.duration;
              const refDur = totalRefDuration;
              const ratio = userDur / refDur;
              
              let timingFeedback = '';
              let timingScore = 0;
              
              if (ratio < 0.7) {
                timingFeedback = '⚡ Too fast! You might be rushing through elongations (madd).';
                timingScore = 1;
              } else if (ratio < 0.85) {
                timingFeedback = '🏃 Slightly fast. Try to hold the madd sounds longer.';
                timingScore = 2;
              } else if (ratio <= 1.15) {
                timingFeedback = '✅ Good pace! Your timing is close to the reference.';
                timingScore = 4;
              } else if (ratio <= 1.3) {
                timingFeedback = '🐢 Slightly slow, but that\'s often better for learning.';
                timingScore = 3;
              } else {
                timingFeedback = '🦥 Much slower than reference. This is fine for practice!';
                timingScore = 3;
              }
              
              setAnalysisResults({
                userDuration: userDur,
                refDuration: refDur,
                ratio,
                timingFeedback,
                timingScore,
                percentDiff: Math.round((ratio - 1) * 100),
                ayahCount: totalAyahs
              });
            } else {
              setAnalysisResults({
                userDuration: userWf?.duration,
                refDuration: null,
                timingFeedback: 'Could not load reference audio for comparison.',
                timingScore: null,
                ayahCount: totalAyahs
              });
            }
          } catch (refErr) {
            console.log('Could not load reference for comparison:', refErr);
            setReferenceWaveform(null);
            setAnalysisResults({
              userDuration: userWf?.duration,
              refDuration: null,
              timingFeedback: 'Reference audio not available for comparison. Use the checklist for self-assessment.',
              timingScore: null,
              ayahCount: totalAyahs
            });
          }
        } catch (err) {
          console.error('Analysis error:', err);
          setError('Could not analyze recording: ' + err.message);
        }
        
        setIsLoadingAnalysis(false);
      };
      
      // Draw waveforms when data changes or panel opens
      React.useEffect(() => {
        // Small delay to ensure canvas is rendered
        const timer = setTimeout(() => {
          if (referenceCanvasRef.current && referenceWaveform && showAnalysis) {
            drawWaveform(referenceCanvasRef.current, referenceWaveform, '#059669', 'Reference');
          }
        }, 100);
        return () => clearTimeout(timer);
      }, [referenceWaveform, showAnalysis]);
      
      React.useEffect(() => {
        // Small delay to ensure canvas is rendered
        const timer = setTimeout(() => {
          if (userCanvasRef.current && userWaveform && showAnalysis) {
            drawWaveform(userCanvasRef.current, userWaveform, '#d97706', 'Your Recording');
          }
        }, 100);
        return () => clearTimeout(timer);
      }, [userWaveform, showAnalysis]);
      
      // Play audio at specific position (for rule jumping)
      const playAtPosition = (audioRef, position, duration = null) => {
        if (audioRef.current) {
          audioRef.current.currentTime = position;
          audioRef.current.play();
          if (duration) {
            setTimeout(() => audioRef.current?.pause(), duration * 1000);
          }
        }
      };
      
      // Save rule score
      const saveRuleScore = (ruleKey, score) => {
        const newScores = { ...ruleScores, [ruleKey]: score };
        setRuleScores(newScores);
        saveToStorage('tajweed_rule_scores', newScores);
      };
      
      // Load rule scores on mount
      React.useEffect(() => {
        const saved = loadFromStorage('tajweed_rule_scores', {});
        setRuleScores(saved);
      }, []);

      const startRecording = async () => {
        try {
          const constraints = { 
            audio: selectedMic 
              ? { deviceId: { exact: selectedMic }, echoCancellation: true, noiseSuppression: true }
              : { echoCancellation: true, noiseSuppression: true }
          };
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          
          // Now that we have permission, enumerate devices to get labels
          try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const mics = devices.filter(d => d.kind === 'audioinput');
            if (mics.length > 0) {
              setAudioDevices(mics);
              if (!selectedMic) {
                setSelectedMic(mics[0].deviceId);
              }
            }
          } catch (e) {
            console.log('Could not enumerate devices:', e);
          }
          
          audioContextRef.current = new AudioContext();
          analyserRef.current = audioContextRef.current.createAnalyser();
          audioContextRef.current.createMediaStreamSource(stream).connect(analyserRef.current);
          analyserRef.current.fftSize = 256;
          
          const updateLevel = () => {
            if (analyserRef.current) {
              const data = new Uint8Array(analyserRef.current.frequencyBinCount);
              analyserRef.current.getByteFrequencyData(data);
              setAudioLevel(data.reduce((a, b) => a + b) / data.length / 128);
              if (mediaRecorderRef.current?.state === 'recording') {
                requestAnimationFrame(updateLevel);
              }
            }
          };
          
          mediaRecorderRef.current = new MediaRecorder(stream);
          chunksRef.current = [];
          
          mediaRecorderRef.current.ondataavailable = (e) => {
            if (e.data.size > 0) chunksRef.current.push(e.data);
          };
          
          mediaRecorderRef.current.onstop = () => {
            const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            
            // Convert to data URL for persistence
            const reader = new FileReader();
            reader.onloadend = () => {
              const dataUrl = reader.result;
              const newRecording = { 
                url, 
                dataUrl, // For localStorage persistence
                surahStart, 
                surahEnd, 
                ayahStart, 
                ayahEnd, 
                time: Date.now(),
                size: blob.size
              };
              setUserRecordings(prev => {
                // Limit to last 10 recordings to save space
                const updated = [...prev, newRecording];
                if (updated.length > 10) {
                  // Revoke old blob URLs
                  updated.slice(0, updated.length - 10).forEach(r => {
                    if (r.url && r.url.startsWith('blob:')) {
                      URL.revokeObjectURL(r.url);
                    }
                  });
                  return updated.slice(-10);
                }
                return updated;
              });
              setLastRecordingSaved(Date.now());
            };
            reader.readAsDataURL(blob);
            
            // Auto-clear the "saved" message after 5 seconds
            setTimeout(() => setLastRecordingSaved(null), 5000);
          };
          
          mediaRecorderRef.current.start();
          setIsRecording(true);
          setRecordingTime(0);
          timerRef.current = setInterval(() => setRecordingTime(t => t + 1), 1000);
          requestAnimationFrame(updateLevel);
        } catch (err) {
          console.error('Mic error:', err);
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            setError('🎤 Microphone access denied. On mobile, this app needs to be served over HTTPS. Try: 1) Allow mic permission in browser settings, or 2) Host this file on a web server with HTTPS.');
          } else if (err.name === 'NotFoundError') {
            setError('🎤 No microphone found. Please connect a microphone and try again.');
          } else if (err.name === 'NotReadableError') {
            setError('🎤 Microphone is busy or unavailable. Close other apps using the mic and try again.');
          } else {
            setError('🎤 Mic error: ' + err.message);
          }
        }
      };

                      onClick={async () => {
                        // Download reference audio(s) with proper ID3 tags
                        setError(null);
                        const downloads = [];
                        
                        for (let s = surahStart; s <= surahEnd; s++) {
                          const startA = s === surahStart ? ayahStart : 1;
                          const endA = s === surahEnd ? ayahEnd : SURAH_DATA[s]?.ayahs;
                          for (let a = startA; a <= endA; a++) {
                            downloads.push({ surah: s, ayah: a });
                          }
                        }
                        
                        // Limit to 20 files at once
                        if (downloads.length > 20) {
                          setError(`Too many files (${downloads.length}). Please select 20 or fewer ayahs.`);
                          return;
                        }
                        
                        // Show progress
                        setError(`Downloading ${downloads.length} file(s) with ID3 tags...`);
                        
                        let trackNum = 1;
                        const totalTracks = downloads.length;
                        
                        for (const { surah, ayah } of downloads) {
                          try {
                            const url = getReferenceAudioUrl(surah, ayah);
                            const response = await fetch(url);
                            const arrayBuffer = await response.arrayBuffer();
                            
                            // Add ID3 tags
                            const surahName = SURAH_DATA[surah]?.name || `Surah ${surah}`;
                            const surahArabic = SURAH_DATA[surah]?.arabic || '';
                            const reciterName = {
                              'yasser_dosari': 'Yasser Al-Dosari',
                              'mishary_alafasy': 'Mishary Alafasy', 
                              'husary': 'Mahmoud Khalil Al-Husary',
                              'minshawi': 'Mohamed Siddiq El-Minshawi'
                            }[reciter] || reciter;
                            
                            // Simple sequential number for filename: 001, 002, 003...
                            const seqNum = String(trackNum).padStart(3,'0');
                            
                            const writer = new ID3Writer(arrayBuffer);
                            writer
                              .setFrame('TIT2', `${surahName} ${surah}:${ayah}`)      // Title
                              .setFrame('TPE1', [reciterName])                         // Artist
                              .setFrame('TALB', `Quran`)                               // Album
                              .setFrame('TRCK', `${trackNum}/${totalTracks}`)          // Track X of Y
                              .setFrame('TCON', ['Religious'])                         // Genre
                            writer.addTag();
                            
                            const taggedBlob = writer.getBlob();
                            const blobUrl = URL.createObjectURL(taggedBlob);
                            
                            const link = document.createElement('a');
                            link.href = blobUrl;
                            // Simple format: 001-_SurahName_1-1_-.mp3
                            link.download = `${seqNum}-_${surahName}_${surah}-${ayah}_-.mp3`;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            
                            URL.revokeObjectURL(blobUrl);
                            trackNum++;
                            
                            // Update progress
                            setError(`Downloading... ${trackNum - 1}/${totalTracks}`);
                            
                            // Small delay between downloads
                            await new Promise(r => setTimeout(r, 300));
                          } catch (err) {
                            console.error(`Failed to download ${surah}:${ayah}`, err);
                          }
                        }
                        
                        setError(null);

                {/* Recordings */}
                {userRecordings.length > 0 && (
                  <div className="bg-white/70 backdrop-blur-sm rounded-xl p-3">
                    <div className="flex justify-between items-center mb-2">
                      <div className="text-amber-800 text-base font-bold">🎧 Your Recordings ({userRecordings.length}/10)</div>
                      <button
                        onClick={() => {
                          if (confirm('Delete all recordings?')) {
                            userRecordings.forEach(r => {
                              if (r.url && r.url.startsWith('blob:')) URL.revokeObjectURL(r.url);
                            });
                            setUserRecordings([]);
                          }
                        }}
                        className="text-red-500 text-xs hover:text-red-700"
                      >🗑️ Clear All</button>
                    </div>
                    <p className="text-amber-700 text-xs mb-1">💾 Auto-saved • Format: WebM</p>
                    <p className="text-amber-600/70 text-xs mb-2">
                      💡 Convert to MP3: use <a href="https://cloudconvert.com/webm-to-mp3" target="_blank" className="underline">cloudconvert.com</a> or VLC
                    </p>
                    <div className="space-y-2 max-h-48 overflow-y-auto">
                      {userRecordings.slice().reverse().map((r, i) => {
                        const actualIndex = userRecordings.length - 1 - i;
                        const isPlaying = isPlayingUserRecording === actualIndex;
                        return (
                          <div
                            key={r.time}
                            className={`flex items-center gap-2 rounded-lg p-2 ${isPlaying ? 'bg-amber-500/30' : 'bg-white/70'}`}
                          >
                            <button
                              onClick={() => isPlaying ? stopUserRecording() : playUserRecording(r.dataUrl || r.url, actualIndex)}
                              className={`w-10 h-10 rounded-full flex items-center justify-center text-lg ${
                                isPlaying ? 'bg-orange-500 text-stone-800' : 'bg-amber-500 text-white'
                              }`}
                            >
                              {isPlaying ? '⏹️' : '▶️'}
                            </button>
                            <div className="flex-1 min-w-0">
                              <div className="text-stone-800 text-sm truncate">
                                {r.surahStart === r.surahEnd 
                                  ? `${SURAH_DATA[r.surahStart]?.arabic} ${r.surahStart}:${r.ayahStart === r.ayahEnd ? r.ayahStart : `${r.ayahStart}-${r.ayahEnd}`}`
                                  : `${SURAH_DATA[r.surahStart]?.arabic} → ${SURAH_DATA[r.surahEnd]?.arabic}`
                                }
                              </div>
                              <div className="text-stone-800/40 text-xs">
                                {new Date(r.time).toLocaleTimeString()}
                              </div>
                            </div>
                            {isPlaying && (
                              <div className="text-amber-700 text-xs animate-pulse">Playing...</div>
                            )}
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                analyzeRecording(r);
                              }}
                              className="bg-cyan-500 hover:bg-cyan-600 text-white text-xs px-2 py-1 rounded"
                              title="Analyze"
                            >📊</button>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                // Download recording
                                const link = document.createElement('a');
                                link.href = r.dataUrl || r.url;
                                const surahPad = String(r.surahStart).padStart(3,'0');
                                const ayahStartPad = String(r.ayahStart).padStart(4,'0');
                                const ayahEndPad = String(r.ayahEnd).padStart(4,'0');
                                const sortableNum = r.ayahStart === r.ayahEnd 
                                  ? `${surahPad}${ayahStartPad}`
                                  : `${surahPad}${ayahStartPad}-${surahPad}${ayahEndPad}`;
                                const surahName = SURAH_DATA[r.surahStart]?.name || 'Surah';
                                link.download = `${sortableNum}-_${surahName}_-.webm`;
                                document.body.appendChild(link);
                                link.click();
                                document.body.removeChild(link);
                              }}
                              className="bg-emerald-500 hover:bg-emerald-600 text-white text-xs px-2 py-1 rounded"
                              title="Download"
                            >⬇️</button>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                if (r.url && r.url.startsWith('blob:')) URL.revokeObjectURL(r.url);
                                setUserRecordings(prev => prev.filter((_, idx) => idx !== actualIndex));
                              }}
                              className="text-red-400 hover:text-red-600 text-sm px-2"
                              title="Delete"
                            >✕</button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Tips */}
                <div className="bg-white/70 backdrop-blur-sm rounded-xl p-3">
                  <div className="text-amber-800 text-base font-bold mb-2">📝 How It Works:</div>
                  <ul className="text-stone-800/60 text-xs space-y-1">
                    <li>1. Load tajweed rules (from Quran.com)</li>
                    <li>2. Listen to reference at slow speed</li>
                    <li>3. Record yourself reciting</li>
                    <li>4. Click 📊 to analyze your recording</li>
                    <li>5. Compare waveforms & rate yourself</li>
                  </ul>
                  <div className="mt-2 pt-2 border-t border-amber-200">
                    <p className="text-amber-700 text-xs">✨ 100% free — no API key needed!</p>
                  </div>
                </div>

                {/* Session Progress */}
                {sessionHistory.length > 0 && (
                  <div className="bg-white/70 backdrop-blur-sm rounded-xl p-3">
                    <div className="flex justify-between items-center mb-2">
                      <div className="text-amber-800 text-base font-bold">Progress</div>
                      <button
                        onClick={() => {
                          if (confirm('Clear all progress history?')) {
                            setSessionHistory([]);
                          }
                        }}
                        className="text-red-500 text-xs hover:text-red-700"
                      >🗑️ Clear</button>
                    </div>
                    <p className="text-amber-700 text-xs mb-2">💾 Saved to this device</p>
                    <div className="flex flex-wrap gap-1">
                      {sessionHistory.slice(-15).map((s, i) => (
                        <div 
                          key={i}
                          className={`w-6 h-6 rounded flex items-center justify-center text-xs font-bold ${
                            s.score >= 8 ? 'bg-green-500 text-white' :
                            s.score >= 5 ? 'bg-yellow-500 text-white' : 
                            'bg-red-500 text-white'
                          }`}
                        >
                          {s.score}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<TajweedTrainer />, document.getElementById('root'));
  </script>
</body>
</html>
